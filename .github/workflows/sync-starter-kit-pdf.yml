name: Sync live Starter Kit PDF

on:
  push:
    branches: [main]
    paths-ignore:
      - "starter-kit.pdf"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download live Starter Kit PDF
        run: |
          curl -L --fail --silent --show-error https://ai-money-lab-3d5q.netlify.app/starter-kit.pdf -o starter-kit.pdf
          test "$(stat -c%s starter-kit.pdf)" -gt 20000
          head -c 5 starter-kit.pdf | grep -q "%PDF-"

      - name: Commit PDF when changed
        run: |
          if git diff --quiet -- starter-kit.pdf; then
            echo "Starter Kit PDF already matches the deployed copy."
            exit 0
          fi
          git config user.name "ai-money-lab-sync"
          git config user.email "actions@users.noreply.github.com"
          git add starter-kit.pdf
          git commit -m "Sync deployed Starter Kit PDF"
          git push
